<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        /* Loading page styles */
        #loading {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar {
            width: 300px;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0;
            background-color: #007bff;
            border-radius: 10px;
            transition: width 0.3s;
        }
    </style>
</head>

<body>

    <div id="access">
        <h1>Enter Password</h1>
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkAccess()">Acceder au log</button>
    </div>

    <div id="loading">
        <h1>Chargement...</h1>
        <div class="progress-bar">
            <div class="progress-bar-inner" id="progress"></div>
        </div>
    </div>

    <script>



        function checkAccess() {
            const password = document.getElementById('password').value;
            const today = new Date();
            const targetDate = new Date(2025, 10, 20); // December 20 (month = 11)
            if (password === "yourpassword") {
                if (today >= targetDate) {
                    window.location.href = "log.html";
                } else {
                    document.getElementById('access').style.display = 'none';
                    document.getElementById('loading').style.display = 'flex';

                    let progress = 0;
                    const maxProgress = 70;

                    const interval = setInterval(() => {
                        progress += 1;
                        document.getElementById('progress').style.width = progress + "%";

                        if (progress >= maxProgress) clearInterval(interval);
                    }, 100);
                }
            }

        }

    </script>

</body>

</html>
